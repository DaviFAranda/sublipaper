name: Validar Sublipaper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Código e atualizador Windows
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Baixar o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Preparar Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Pedidos/requirements.txt
      - name: Instalar dependências da cópia de teste
        run: |
          python -m pip install -r Pedidos/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar sintaxe Python, JavaScript, JSON e PowerShell
        run: |
          $script:systemRoot = $env:GITHUB_WORKSPACE
          . ./ferramentas/deploy.ps1
          Test-SystemCode
      - name: Testar atualização, backup e recuperação com bancos fictícios
        run: |
          python tests/test_updates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
